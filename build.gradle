plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.example.dyparse'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.dyparse'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
